<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #ffc44d; }
    a:hover { color: #ffd782; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0a0713; font-family: Nunito, system-ui, sans-serif; color: #f4f1ff; display: flex; flex-direction: column; align-items: center; overflow: hidden; position: relative;">

  <div style="position: absolute; left: -60px; top: 90px; width: 510px; height: 510px; background: radial-gradient(circle, rgba(240,70,120,0.45) 0%, rgba(240,70,120,0.12) 40%, rgba(240,70,120,0) 68%);"></div>
  <div style="position: absolute; left: -55px; top: 95px; width: 500px; height: 500px; border-radius: 50%; background: conic-gradient(from 0deg, rgba(255,196,77,0.16) 0deg 12deg, rgba(255,196,77,0) 12deg 30deg, rgba(255,196,77,0.16) 30deg 42deg, rgba(255,196,77,0) 42deg 60deg, rgba(255,196,77,0.16) 60deg 72deg, rgba(255,196,77,0) 72deg 90deg, rgba(255,196,77,0.16) 90deg 102deg, rgba(255,196,77,0) 102deg 120deg, rgba(255,196,77,0.16) 120deg 132deg, rgba(255,196,77,0) 132deg 150deg, rgba(255,196,77,0.16) 150deg 162deg, rgba(255,196,77,0) 162deg 180deg, rgba(255,196,77,0.16) 180deg 192deg, rgba(255,196,77,0) 192deg 210deg, rgba(255,196,77,0.16) 210deg 222deg, rgba(255,196,77,0) 222deg 240deg, rgba(255,196,77,0.16) 240deg 252deg, rgba(255,196,77,0) 252deg 270deg, rgba(255,196,77,0.16) 270deg 282deg, rgba(255,196,77,0) 282deg 300deg, rgba(255,196,77,0.16) 300deg 312deg, rgba(255,196,77,0) 312deg 330deg, rgba(255,196,77,0.16) 330deg 342deg, rgba(255,196,77,0) 342deg 360deg);"></div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; width: 100%;">

    <div style="margin-top: 96px; display: flex; align-items: center; gap: 9px; background: linear-gradient(180deg, #ffd782 0%, #ffb01f 100%); border: 3px solid #0a0713; border-radius: 999px; padding: 8px 22px; box-shadow: 0 4px 0 #0a0713, 0 0 30px rgba(255,196,77,0.45);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M12 2.5 L14.2 9.4 L21 11.6 L14.2 13.8 L12 20.7 L9.8 13.8 L3 11.6 L9.8 9.4 Z" fill="#6b4200"/>
      </svg>
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.14em; color: #6b4200;">NEW DISCOVERY</span>
    </div>

    <div style="margin-top: 26px; width: 224px; height: 224px; border-radius: 34px; background: linear-gradient(160deg, #f0468b 0%, #8b5cf6 100%); border: 4px solid #0a0713; box-shadow: 0 0 56px rgba(240,70,120,0.6), 0 8px 0 #0a0713; display: flex; align-items: center; justify-content: center;">
      <div style="width: 196px; height: 196px; border-radius: 24px; background: radial-gradient(circle at 50% 34%, #3b2350 0%, #150c22 76%); display: flex; align-items: center; justify-content: center;">
        <svg width="132" height="132" viewBox="0 0 120 120" fill="none">
          <path d="M60 16c-7 0-12 4-14 10-10 1-19 7-24 16 6-2 11-2 15 0-8 6-13 15-14 26 5-7 11-11 17-13-3 8-2 17 3 25 1-9 5-16 11-21 4 5 10 8 17 8 12 0 22-8 25-19 4 3 7 8 8 14 4-9 3-19-3-27 5 1 10 4 14 9-2-12-9-21-20-26-2-6-8-10-15-10-3 0-6 1-8 3-2-2-5-3-8-3-3 0-6 1-8 3" fill="rgba(240,70,120,0.20)" stroke="#ff9dc0" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="50" cy="52" r="4" fill="#ffd782"/>
          <circle cx="70" cy="52" r="4" fill="#ffd782"/>
        </svg>
      </div>
    </div>

    <div style="margin-top: 22px; font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 700; font-size: 34px; color: #ffffff; text-shadow: 0 3px 0 rgba(0,0,0,0.4); text-align: center; line-height: 1.05;">Solar Phoenix</div>

    <div style="margin-top: 12px; display: flex; align-items: center; gap: 8px;">
      <div style="background: linear-gradient(180deg, #f0468b 0%, #b81e59 100%); border: 3px solid #0a0713; border-radius: 999px; padding: 5px 16px; box-shadow: 0 3px 0 #0a0713;">
        <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.12em; color: #ffffff;">MYTHIC</span>
      </div>
      <div style="background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.16); border-radius: 999px; padding: 5px 14px;">
        <span style="font-size: 12px; font-weight: 800; color: #d8d0f0;">1 in 12,400</span>
      </div>
    </div>

    <div style="margin-top: 20px; display: flex; align-items: center; gap: 7px;">
      <div style="display: flex; align-items: center; gap: 6px; background: rgba(230,77,41,0.16); border: 2px solid rgba(230,77,41,0.45); border-radius: 999px; padding: 5px 12px;">
        <div style="width: 9px; height: 9px; border-radius: 50%; background: #e64d29;"></div>
        <span style="font-size: 12px; font-weight: 700; color: #ffb694;">Fire</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; background: rgba(191,217,242,0.14); border: 2px solid rgba(191,217,242,0.42); border-radius: 999px; padding: 5px 12px;">
        <div style="width: 9px; height: 9px; border-radius: 50%; background: #bfd9f2;"></div>
        <span style="font-size: 12px; font-weight: 700; color: #d5e8fa;">Air</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; background: rgba(115,51,166,0.22); border: 2px solid rgba(115,51,166,0.55); border-radius: 999px; padding: 5px 12px;">
        <div style="width: 9px; height: 9px; border-radius: 50%; background: #9147d1;"></div>
        <span style="font-size: 12px; font-weight: 700; color: #d6a9ff;">Void</span>
      </div>
    </div>

    <div style="margin-top: 22px; display: flex; align-items: center; gap: 8px; background: rgba(90,217,240,0.10); border: 2px solid rgba(90,217,240,0.30); border-radius: 14px; padding: 9px 18px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M7 3.5 H17 L21.5 10 L12 21 L2.5 10 Z" fill="#5ad9f0" stroke="#0d5e70" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 600; font-size: 16px; color: #8ee9fb;">+150 Gems</span>
    </div>

  </div>

  <div style="position: relative; margin-top: auto; width: 100%; display: flex; gap: 10px; padding: 0 20px 30px 20px; box-sizing: border-box;">
    <div style="flex-grow: 1; height: 62px; border-radius: 18px; border: 3px solid #0a0713; background: linear-gradient(180deg, #a78bfa 0%, #7c3aed 55%, #6423d4 100%); box-shadow: 0 5px 0 #0a0713; display: flex; align-items: center; justify-content: center;">
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 700; font-size: 19px; color: #ffffff; text-shadow: 0 2px 0 rgba(0,0,0,0.3);">Add to Sanctuary</span>
    </div>
    <div style="width: 62px; height: 62px; border-radius: 18px; border: 3px solid #0a0713; background: linear-gradient(180deg, #322a5c 0%, #241d45 100%); box-shadow: 0 5px 0 #0a0713; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <circle cx="17.5" cy="5.5" r="3" stroke="#ffc44d" stroke-width="1.9"/>
        <circle cx="6" cy="12" r="3" stroke="#ffc44d" stroke-width="1.9"/>
        <circle cx="17.5" cy="18.5" r="3" stroke="#ffc44d" stroke-width="1.9"/>
        <path d="M8.7 10.6 14.8 7M8.7 13.4 14.8 17" stroke="#ffc44d" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
