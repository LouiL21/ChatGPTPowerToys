<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #ffc44d; }
    a:hover { color: #ffd782; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: radial-gradient(120% 55% at 50% 10%, #2e2459 0%, #17122e 48%, #0c0916 100%); font-family: Nunito, system-ui, sans-serif; color: #f4f1ff; display: flex; flex-direction: column; overflow: hidden;">

  <!-- Currency bar -->
  <div style="display: flex; gap: 8px; padding: 16px 14px 0 14px; align-items: stretch;">

    <div style="flex-grow: 1; display: flex; align-items: center; gap: 9px; background: linear-gradient(180deg, #2f2757 0%, #241d45 100%); border: 3px solid #0a0713; border-radius: 15px; padding: 8px 12px; box-shadow: 0 3px 0 #0a0713;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 2.5 L14.4 9.6 L21.5 12 L14.4 14.4 L12 21.5 L9.6 14.4 L2.5 12 L9.6 9.6 Z" fill="#ffc44d" stroke="#7a5310" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-size: 20px; font-weight: 700; color: #ffd782; line-height: 1;">601.4</span>
        <span style="font-size: 9px; font-weight: 800; color: #9c93bd; letter-spacing: 0.12em;">ESSENCE</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 9px; background: linear-gradient(180deg, #2f2757 0%, #241d45 100%); border: 3px solid #0a0713; border-radius: 15px; padding: 8px 12px; box-shadow: 0 3px 0 #0a0713;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M7 3.5 H17 L21.5 10 L12 21 L2.5 10 Z" fill="#5ad9f0" stroke="#0d5e70" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M7 3.5 L12 10 L17 3.5 M2.5 10 H21.5" stroke="#0d5e70" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-size: 20px; font-weight: 700; color: #8ee9fb; line-height: 1;">9</span>
    </div>

  </div>

  <!-- Altar hero -->
  <div style="position: relative; height: 238px; display: flex; align-items: center; justify-content: center;">

    <div style="position: absolute; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,0.42) 0%, rgba(139,92,246,0.10) 46%, rgba(139,92,246,0) 70%);"></div>

    <div style="position: relative; width: 220px; height: 220px;">

      <div style="position: absolute; left: 10px; top: 10px; width: 200px; height: 200px; border-radius: 50%; border: 2px dashed rgba(167,159,199,0.38);"></div>

      <div style="position: absolute; left: 20px; top: 20px; width: 20px; height: 20px; border-radius: 50%; background: #e64d29; border: 2px solid #0a0713; box-shadow: 0 0 12px rgba(230,77,41,0.85);"></div>
      <div style="position: absolute; left: 150px; top: 13px; width: 20px; height: 20px; border-radius: 50%; background: #bfd9f2; border: 2px solid #0a0713; box-shadow: 0 0 12px rgba(191,217,242,0.85);"></div>
      <div style="position: absolute; left: 200px; top: 100px; width: 20px; height: 20px; border-radius: 50%; background: #338cf2; border: 2px solid #0a0713; box-shadow: 0 0 12px rgba(51,140,242,0.85);"></div>
      <div style="position: absolute; left: 150px; top: 186px; width: 20px; height: 20px; border-radius: 50%; background: #4dbf59; border: 2px solid #0a0713; box-shadow: 0 0 12px rgba(77,191,89,0.85);"></div>
      <div style="position: absolute; left: 50px; top: 186px; width: 20px; height: 20px; border-radius: 50%; background: #8c6638; border: 2px solid #0a0713; box-shadow: 0 0 12px rgba(140,102,56,0.85);"></div>
      <div style="position: absolute; left: 0px; top: 100px; width: 20px; height: 20px; border-radius: 50%; background: #7333a6; border: 2px solid #0a0713; box-shadow: 0 0 12px rgba(115,51,166,0.9);"></div>

      <div style="position: absolute; left: 40px; top: 40px; width: 140px; height: 140px; border-radius: 50%; background: conic-gradient(from 200deg, #8b5cf6, #f0468b, #ffc44d, #4dbf59, #338cf2, #8b5cf6); border: 4px solid #0a0713; box-shadow: 0 0 46px rgba(139,92,246,0.55), 0 6px 0 #0a0713; display: flex; align-items: center; justify-content: center;">
        <div style="width: 106px; height: 106px; border-radius: 50%; background: radial-gradient(circle at 50% 32%, #46387d 0%, #1a1433 72%); border: 3px solid #0a0713; display: flex; align-items: center; justify-content: center;">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none">
            <path d="M12 2.5 L20 7 V17 L12 21.5 L4 17 V7 Z" stroke="#c9b6ff" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M12 7.5 L16 10 V15 L12 17.5 L8 15 V10 Z" fill="rgba(255,196,77,0.22)" stroke="#ffc44d" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

    </div>
  </div>

  <div style="display: flex; justify-content: center;">
    <div style="display: flex; align-items: center; gap: 7px; background: rgba(255,196,77,0.12); border: 2px solid rgba(255,196,77,0.32); border-radius: 999px; padding: 5px 14px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <path d="M13 2 L4 14 H11 L10 22 L20 9 H13 Z" fill="#ffc44d" stroke="#7a5310" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 600; font-size: 13px; color: #ffd782;">1.2 essence / sec</span>
    </div>
  </div>

  <!-- Shard picker -->
  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 18px 16px 9px 16px;">
    <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 600; font-size: 16px;">Choose 2&ndash;3 shards</span>
    <span style="font-size: 11px; font-weight: 800; color: #9c93bd; letter-spacing: 0.04em;">10 EACH</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 0 16px;">

    <div style="position: relative; height: 76px; border-radius: 17px; border: 3px solid #0a0713; background: linear-gradient(180deg, #f2663e 0%, #c33a18 100%); box-shadow: 0 0 0 3px #ffffff, 0 2px 0 #0a0713, 0 0 20px rgba(230,77,41,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 2.5c3 4 5.5 6 5.5 10a5.5 5.5 0 1 1-11 0c0-2 1-3.5 2.5-5 .3 1.4 1 2 2 2.2-.5-3 .3-5.3 1-7.2Z" fill="#ffd9a0" stroke="#6b1f06" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 600; font-size: 12px; color: #ffffff;">Fire</span>
      <div style="position: absolute; top: -7px; right: -5px; background: #0a0713; border: 2px solid #f2663e; border-radius: 999px; padding: 1px 7px;">
        <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-size: 11px; font-weight: 700; color: #ffb694;">5</span>
      </div>
    </div>

    <div style="position: relative; height: 76px; border-radius: 17px; border: 3px solid #0a0713; background: linear-gradient(180deg, #4f9ffa 0%, #1f6cc9 100%); box-shadow: 0 0 0 3px #ffffff, 0 2px 0 #0a0713, 0 0 20px rgba(51,140,242,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 2.5 C16 8 18.5 11 18.5 14.5a6.5 6.5 0 1 1-13 0C5.5 11 8 8 12 2.5Z" fill="#bfe3ff" stroke="#0b3a6b" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 600; font-size: 12px; color: #ffffff;">Water</span>
      <div style="position: absolute; top: -7px; right: -5px; background: #0a0713; border: 2px solid #4f9ffa; border-radius: 999px; padding: 1px 7px;">
        <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-size: 11px; font-weight: 700; color: #a8d3ff;">19</span>
      </div>
    </div>

    <div style="position: relative; height: 76px; border-radius: 17px; border: 3px solid #0a0713; background: linear-gradient(180deg, #a67a45 0%, #6f4f2b 100%); box-shadow: 0 4px 0 #0a0713; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M2.5 19.5 L9 8 L13 14 L15.5 10 L21.5 19.5 Z" fill="#e0c39a" stroke="#4a3115" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 600; font-size: 12px; color: #ffffff;">Earth</span>
      <div style="position: absolute; top: -7px; right: -5px; background: #0a0713; border: 2px solid #a67a45; border-radius: 999px; padding: 1px 7px;">
        <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-size: 11px; font-weight: 700; color: #dcbb8e;">21</span>
      </div>
    </div>

    <div style="position: relative; height: 76px; border-radius: 17px; border: 3px solid #0a0713; background: linear-gradient(180deg, #d5e8fa 0%, #9fc3e0 100%); box-shadow: 0 4px 0 #0a0713; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M3 8.5h9.5a3 3 0 1 0-3-3M3 13h13a3 3 0 1 1-3 3M3 17.5h7" stroke="#2c4c66" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 600; font-size: 12px; color: #24384a;">Air</span>
      <div style="position: absolute; top: -7px; right: -5px; background: #0a0713; border: 2px solid #d5e8fa; border-radius: 999px; padding: 1px 7px;">
        <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-size: 11px; font-weight: 700; color: #d5e8fa;">15</span>
      </div>
    </div>

    <div style="position: relative; height: 76px; border-radius: 17px; border: 3px solid #0a0713; background: linear-gradient(180deg, #61d46e 0%, #2f9a3d 100%); box-shadow: 0 4px 0 #0a0713; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M20 3.5c0 9-5 13.5-11 13.5-2 0-3.5-.6-4.5-1.5 1-8 6-12 15.5-12Z" fill="#c6f5c9" stroke="#134d1c" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M4 20.5c2-4.5 5-7.5 9.5-9.5" stroke="#134d1c" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 600; font-size: 12px; color: #ffffff;">Nature</span>
      <div style="position: absolute; top: -7px; right: -5px; background: #0a0713; border: 2px solid #61d46e; border-radius: 999px; padding: 1px 7px;">
        <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-size: 11px; font-weight: 700; color: #a9edb1;">15</span>
      </div>
    </div>

    <div style="position: relative; height: 76px; border-radius: 17px; border: 3px solid #0a0713; background: linear-gradient(180deg, #9147d1 0%, #55207f 100%); box-shadow: 0 4px 0 #0a0713; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" fill="#1a0a2b" stroke="#d6a9ff" stroke-width="1.6"/>
        <path d="M12 6.5a5.5 5.5 0 0 1 0 11" stroke="#d6a9ff" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 600; font-size: 12px; color: #ffffff;">Void</span>
      <div style="position: absolute; top: -7px; right: -5px; background: #0a0713; border: 2px solid #9147d1; border-radius: 999px; padding: 1px 7px;">
        <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-size: 11px; font-weight: 700; color: #d6a9ff;">13</span>
      </div>
    </div>

  </div>

  <!-- Combo readout -->
  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 16px 0 16px;">
    <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-size: 13px; font-weight: 600; color: #ffb694;">Fire</span>
    <span style="font-size: 13px; font-weight: 800; color: #6d648f;">+</span>
    <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-size: 13px; font-weight: 600; color: #a8d3ff;">Water</span>
    <span style="font-size: 11px; font-weight: 800; color: #6d648f;">&middot;</span>
    <span style="font-size: 12px; font-weight: 700; color: #9c93bd;">3 beasts, 1 undiscovered</span>
  </div>

  <!-- Primary action -->
  <div style="padding: 10px 16px 0 16px;">
    <div style="height: 64px; border-radius: 19px; border: 3px solid #0a0713; background: linear-gradient(180deg, #a78bfa 0%, #7c3aed 55%, #6423d4 100%); box-shadow: 0 5px 0 #0a0713, 0 0 26px rgba(139,92,246,0.45); display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M12 2.5 L14.2 9.4 L21 11.6 L14.2 13.8 L12 20.7 L9.8 13.8 L3 11.6 L9.8 9.4 Z" fill="#ffffff"/>
      </svg>
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.06em; color: #ffffff; text-shadow: 0 2px 0 rgba(0,0,0,0.32);">FUSE</span>
    </div>
  </div>

  <!-- Bottom nav -->
  <div style="margin-top: auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; padding: 14px 12px 18px 12px;">

    <div style="height: 58px; border-radius: 15px; border: 3px solid #0a0713; background: linear-gradient(180deg, #7c3aed 0%, #5b21b6 100%); box-shadow: 0 3px 0 #0a0713; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
        <path d="M9.5 2.5v6L4.5 18a3 3 0 0 0 2.7 4.3h9.6A3 3 0 0 0 19.5 18l-5-9.5v-6Z" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M8.5 2.5h7" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span style="font-size: 9px; font-weight: 800; color: #ffffff; letter-spacing: 0.03em;">FUSE</span>
    </div>

    <div style="height: 58px; border-radius: 15px; border: 3px solid #0a0713; background: linear-gradient(180deg, #322a5c 0%, #241d45 100%); box-shadow: 0 3px 0 #0a0713; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
        <path d="M4 4.5A2 2 0 0 1 6 2.5h13v16H6a2 2 0 0 0-2 2Z" stroke="#c3bade" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M4 20.5a2 2 0 0 1 2-2h13v3H6a2 2 0 0 1-2-1Z" stroke="#c3bade" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
      <span style="font-size: 9px; font-weight: 800; color: #c3bade; letter-spacing: 0.03em;">DEX</span>
    </div>

    <div style="position: relative; height: 58px; border-radius: 15px; border: 3px solid #0a0713; background: linear-gradient(180deg, #322a5c 0%, #241d45 100%); box-shadow: 0 3px 0 #0a0713; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
        <path d="M5 3.5h11l4 4v13H5Z" stroke="#c3bade" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M8.5 12.5l2.5 2.5 4.5-5" stroke="#5ad9f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span style="font-size: 9px; font-weight: 800; color: #c3bade; letter-spacing: 0.03em;">QUESTS</span>
      <div style="position: absolute; top: -6px; right: -4px; width: 20px; height: 20px; border-radius: 50%; background: #f0468b; border: 2px solid #0a0713; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 10px; font-weight: 800; color: #ffffff;">2</span>
      </div>
    </div>

    <div style="height: 58px; border-radius: 15px; border: 3px solid #0a0713; background: linear-gradient(180deg, #322a5c 0%, #241d45 100%); box-shadow: 0 3px 0 #0a0713; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
        <path d="M3.5 6.5h17l-1.5 11a2 2 0 0 1-2 1.7H7a2 2 0 0 1-2-1.7Z" stroke="#ffc44d" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M8.5 9.5v-3a3.5 3.5 0 0 1 7 0v3" stroke="#ffc44d" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <span style="font-size: 9px; font-weight: 800; color: #ffc44d; letter-spacing: 0.03em;">SHOP</span>
    </div>

    <div style="height: 58px; border-radius: 15px; border: 3px solid #0a0713; background: linear-gradient(180deg, #322a5c 0%, #241d45 100%); box-shadow: 0 3px 0 #0a0713; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
        <path d="M12 3.5 L19 11 h-4v9.5H9V11H5Z" stroke="#c3bade" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
      <span style="font-size: 9px; font-weight: 800; color: #c3bade; letter-spacing: 0.03em;">ALTAR</span>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
