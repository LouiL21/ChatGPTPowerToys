<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #00f0ff; }
    a:hover { color: #7df7ff; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #050508; font-family: Nunito, system-ui, sans-serif; color: #e8f9ff; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 16px 16px 0 16px; display: flex; gap: 8px;">
    <div style="flex-grow: 1; height: 46px; border-radius: 8px; background: #0c0c14; border: 2px solid #00f0ff; box-shadow: 0 0 16px rgba(0,240,255,0.35); display: flex; align-items: center; padding: 0 14px;">
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-size: 19px; font-weight: 700; color: #00f0ff;">601.4</span>
    </div>
    <div style="width: 94px; height: 46px; border-radius: 8px; background: #0c0c14; border: 2px solid #ff2ea6; box-shadow: 0 0 16px rgba(255,46,166,0.35); display: flex; align-items: center; justify-content: center;">
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-size: 19px; font-weight: 700; color: #ff2ea6;">9</span>
    </div>
  </div>

  <div style="height: 220px; display: flex; align-items: center; justify-content: center; position: relative;">
    <div style="position: absolute; width: 240px; height: 240px; border-radius: 50%; background: radial-gradient(circle, rgba(0,240,255,0.22) 0%, rgba(0,240,255,0) 66%);"></div>
    <div style="width: 168px; height: 168px; border-radius: 50%; border: 2px solid #00f0ff; box-shadow: 0 0 34px rgba(0,240,255,0.5), inset 0 0 34px rgba(0,240,255,0.25); display: flex; align-items: center; justify-content: center;">
      <div style="width: 96px; height: 96px; transform: rotate(45deg); background: linear-gradient(135deg, rgba(255,46,166,0.35) 0%, rgba(0,240,255,0.35) 100%); border: 2px solid #ff2ea6; box-shadow: 0 0 26px rgba(255,46,166,0.5);"></div>
    </div>
  </div>

  <div style="padding: 0 16px;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <div style="height: 72px; border-radius: 8px; background: #12060a; border: 2px solid #ff5c39; box-shadow: 0 0 14px rgba(255,92,57,0.4);"></div>
      <div style="height: 72px; border-radius: 8px; background: #04101c; border: 2px solid #29a3ff; box-shadow: 0 0 14px rgba(41,163,255,0.4);"></div>
      <div style="height: 72px; border-radius: 8px; background: #120d04; border: 2px solid #d19a4a; box-shadow: 0 0 14px rgba(209,154,74,0.35);"></div>
      <div style="height: 72px; border-radius: 8px; background: #0a1015; border: 2px solid #b9e4ff; box-shadow: 0 0 14px rgba(185,228,255,0.35);"></div>
      <div style="height: 72px; border-radius: 8px; background: #041207; border: 2px solid #39ff88; box-shadow: 0 0 14px rgba(57,255,136,0.4);"></div>
      <div style="height: 72px; border-radius: 8px; background: #0d0416; border: 2px solid #b14dff; box-shadow: 0 0 14px rgba(177,77,255,0.45);"></div>
    </div>
  </div>

  <div style="padding: 18px 16px 0 16px;">
    <div style="height: 64px; border-radius: 10px; background: linear-gradient(90deg, rgba(255,46,166,0.22) 0%, rgba(0,240,255,0.22) 100%); border: 2px solid #ff2ea6; box-shadow: 0 0 28px rgba(255,46,166,0.45); display: flex; align-items: center; justify-content: center;">
      <span style="font-family: Fredoka, 'Trebuchet MS', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 0.16em; color: #ffffff;">FUSE</span>
    </div>
  </div>

  <div style="margin-top: auto; padding: 14px 14px 18px 14px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;">
    <div style="height: 56px; border-radius: 8px; background: #0c0c14; border: 2px solid #00f0ff;"></div>
    <div style="height: 56px; border-radius: 8px; background: #0c0c14; border: 2px solid #1d2530;"></div>
    <div style="height: 56px; border-radius: 8px; background: #0c0c14; border: 2px solid #1d2530;"></div>
    <div style="height: 56px; border-radius: 8px; background: #0c0c14; border: 2px solid #1d2530;"></div>
    <div style="height: 56px; border-radius: 8px; background: #0c0c14; border: 2px solid #1d2530;"></div>
  </div>

  <div style="position: absolute; left: 16px; top: 262px; border: 1px solid #00f0ff; border-radius: 4px; padding: 4px 10px;">
    <span style="font-size: 11px; font-weight: 800; color: #00f0ff; letter-spacing: 0.1em;">C &middot; NEON ARCADE</span>
  </div>

</div>
</x-dc>
</body>
</html>
