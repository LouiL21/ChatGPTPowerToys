<!doctype html>
<html>
<head>

  <script src="./support.js"></script>

<body>
<x-dc>

  </div>

  <div style="padding: 0 16px;">

  <div style="padding: 18px 16px 0 16px;">

    <div style="height: 56px; border-radius: 15px; background: #ffffff; border: 3px solid #3a2d1f; box-shadow: 0 3px 0 #3a2d1f;"></div>
    <div style="height: 56px; border-radius: 15px; background: #ffffff; border: 3px solid #3a2d1f; box-shadow: 0 3px 0 #3a2d1f;"></div>
    <div style="height: 56px; border-radius: 15px; background: #ffffff; border: 3px solid #3a2d1f; box-shadow: 0 3px 0 #3a2d1f;"></div>
    <div style="height: 56px; border-radius: 15px; background: #ffffff; border: 3px solid #3a2d1f; box-shadow: 0 3px 0 #3a2d1f;"></div>

  <div style="position: absolute; left: 16px; top: 262px; background: #3a2d1f; border-radius: 8px; padding: 4px 10px;">
